<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Arabe fusha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }
#app { max-width: 520px; margin: 0 auto; padding: 16px 16px 60px; }
.ar { font-family: 'Noto Naskh Arabic', 'Traditional Arabic', 'Segoe UI', serif; direction: rtl; line-height: 1.9; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #222; }
.header h1 { font-size: 17px; font-weight: 700; }
.header p { font-size: 11px; color: #555; margin-top: 2px; }
.streak { font-size: 13px; color: #f0a500; }

/* DAY NAV */
.day-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.day-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #2a2a2a; background: #1a1a1a; color: #333; font-size: 13px; font-weight: 600; cursor: default; display: flex; align-items: center; justify-content: center; }
.day-btn.unlocked { border-color: #3a3a3a; color: #888; cursor: pointer; }
.day-btn.unlocked:hover { border-color: #555; color: #ccc; }
.day-btn.active { border-color: #4a90d9; color: #4a90d9; background: #0d1f2f; }
.day-btn.done { border-color: #2d5a2d; color: #4a8a4a; background: #0d1f0d; }

/* PROGRESS */
.progress-bar { height: 2px; background: #1a1a1a; border-radius: 2px; margin-bottom: 20px; }
.progress-fill { height: 100%; background: #4a90d9; border-radius: 2px; transition: width 0.4s; }

/* STEP TABS */
.step-tabs { display: flex; gap: 0; border: 1px solid #222; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.step-tab { flex: 1; padding: 9px 4px; text-align: center; font-size: 12px; color: #444; background: #111; border: none; cursor: default; }
.step-tab.reachable { color: #666; cursor: pointer; }
.step-tab.active { background: #0d1f2f; color: #4a90d9; }
.step-tab.done-tab { color: #4a8a4a; }

/* SECTION TITLE */
.section-label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

/* WORD LIST */
.word-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }
.word-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #141414; border-radius: 8px; }
.word-row:hover { background: #1a1a1a; }
.word-main { flex: 1; }
.word-translation { font-size: 14px; color: #999; }
.word-note { font-size: 13px; color: #77808c; margin-top: 3px; line-height: 1.6; }
.word-arabic { font-size: 24px; color: #e8e8e8; text-align: right; }

/* PHRASE LIST */
.phrase-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 28px; }
.phrase-row { padding: 10px 12px; background: #141414; border-radius: 8px; }
.phrase-row:hover { background: #1a1a1a; }
.phrase-arabic { font-size: 22px; color: #e8e8e8; text-align: right; }
.phrase-translation { font-size: 13px; color: #777; }

/* NEXT STEP BTN */
.btn-next-step { width: 100%; padding: 13px; background: #0d1f2f; border: 1px solid #2a4a6a; color: #4a90d9; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; }
.btn-next-step:hover { background: #1a2a3a; }

/* EXERCISE */
.ex-counter { font-size: 11px; color: #444; margin-bottom: 12px; text-align: right; }

/* EXO 1 — LIRE */
.ex1-word { font-size: 40px; text-align: center; padding: 20px; background: #141414; border-radius: 12px; margin-bottom: 20px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn { padding: 13px 16px; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; color: #ccc; font-size: 14px; cursor: pointer; text-align: left; }
.choice-btn:hover { background: #1a1a1a; border-color: #3a3a3a; }
.choice-btn.correct { background: #0d1f0d; border-color: #2d5a2d; color: #4a8a4a; }
.choice-btn.wrong { background: #1f0d0d; border-color: #5a2d2d; color: #8a4a4a; }
.choice-btn:disabled { cursor: default; }
.choice-btn.ar { text-align: right; font-size: 22px; padding: 6px 16px; }

/* EXO 3 — ÉCRIRE */
.ex3-prompt { font-size: 16px; color: #ccc; text-align: center; padding: 20px; background: #141414; border-radius: 12px; margin-bottom: 16px; }
.ex3-prompt-label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.ex3-input { width: 100%; resize: none; background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 14px; color: #e8e8e8; font-size: 22px; outline: none; margin-bottom: 10px; }
.ex3-input:focus { border-color: #4a90d9; }
.ex3-input.correct { border-color: #2d5a2d; background: #0d1f0d; }
.ex3-input.wrong { border-color: #5a2d2d; background: #1f0d0d; }
.ex3-answer { font-size: 22px; color: #4a8a4a; margin-bottom: 12px; padding: 6px 12px; background: #0d1f0d; border-radius: 8px; text-align: right; }
.btn-check { width: 100%; padding: 12px; background: #141414; border: 1px solid #2a2a2a; color: #888; border-radius: 10px; font-size: 14px; cursor: pointer; }
.btn-check:hover { border-color: #4a90d9; color: #4a90d9; }
.btn-skip { width: 100%; padding: 10px; background: transparent; border: none; color: #555; font-size: 13px; cursor: pointer; margin-top: 4px; }
.btn-skip:hover { color: #888; }

/* COMPLETE */
.complete-box { text-align: center; padding: 40px 20px; }
.complete-box h2 { font-size: 22px; margin-bottom: 8px; }
.complete-box p { font-size: 14px; color: #555; margin-bottom: 24px; }
.btn-complete { padding: 13px 28px; background: #0d1f0d; border: 1px solid #2d5a2d; color: #4a8a4a; border-radius: 10px; font-size: 15px; cursor: pointer; }
.btn-complete:hover { background: #1a2a1a; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Contenu : voir « Règles de contenu » et « Mots déjà connus » dans SPRINTS.md.
// words:   { ar (vocalisé), fr, note? }
// phrases: { ar (vocalisé), fr, accept? (autres réponses acceptées) }
const DAYS = [
  {
    id: 1, title: "Le réveil et le programme du jour",
    words: [
      { ar: "أَسْتَيْقِظُ", fr: "Je me réveille" },
      { ar: "أَنَامُ", fr: "Je dors" },
      { ar: "جَيِّدًا", fr: "Bien" },
      { ar: "بِصَرَاحَةٍ", fr: "Franchement" },
      { ar: "وَأَنْتَ؟", fr: "Et toi ?" },
      { ar: "حَسَنًا", fr: "Bon / D'accord", note: "Pour acquiescer ou gagner du temps : حَسَنًا… أَفْهَمُ" },
      { ar: "أَفْهَمُ", fr: "Je comprends", note: "لَا أَفْهَمُ = je ne comprends pas" },
      { ar: "كُلَّ شَيْءٍ", fr: "Tout" },
      { ar: "مَا مَعْنَى…؟", fr: "C'est quoi un… ? / Que veut dire… ?" },
      { ar: "أَعْرِفُ", fr: "Je sais", note: "لَا أَعْرِفُ = je ne sais pas" },
      { ar: "مَاذَا", fr: "Quoi", note: "Devant un nom, on dit مَا : مَا بَرْنَامَجُكَ؟" },
      { ar: "أَيْنَ", fr: "Où" },
      { ar: "الْيَوْمَ", fr: "Aujourd'hui", note: "Vient de يَوْمٌ (jour), déjà connu" },
      { ar: "الْآنَ", fr: "Maintenant" },
      { ar: "بَعْدَ قَلِيلٍ", fr: "Tout à l'heure" },
      { ar: "لَاحِقًا", fr: "Plus tard" },
      { ar: "لَيْسَ بَعْدُ", fr: "Pas encore", note: "Réponse toute faite · à ne pas confondre avec بَعْدَ قَلِيلٍ (tout à l'heure)" },
      { ar: "ـِي", fr: "Mon / Ma / Mes", note: "Se colle au nom : دُرُوسِي = mes cours" },
      { ar: "ـكَ", fr: "Ton / Ta / Tes", note: "Se colle au nom : بَرْنَامَجُكَ = ton programme" },
      { ar: "بَرْنَامَجٌ", fr: "Programme" },
      { ar: "أُرَاجِعُ", fr: "Je révise" },
      { ar: "دُرُوسٌ", fr: "Cours" },
      { ar: "وَاجِبَاتٌ", fr: "Devoirs" },
      { ar: "أَحُلُّ", fr: "Je fais (les devoirs)", note: "أَحُلُّ وَاجِبَاتِي = je fais mes devoirs" },
      { ar: "آكُلُ", fr: "Je mange" },
      { ar: "فِي الْخَارِجِ", fr: "Dehors" },
      { ar: "أَذْهَبُ", fr: "Je vais" },
      { ar: "ثُمَّ", fr: "Puis" },
      { ar: "لَكِنْ", fr: "Mais" },
      { ar: "رُبَّمَا", fr: "Peut-être" },
    ],
    phrases: [
      { ar: "أَسْتَيْقِظُ الْآنَ. وَأَنْتَ؟", fr: "Je me réveille là. Et toi ?" },
      { ar: "مَا بَرْنَامَجُكَ الْيَوْمَ؟", fr: "C'est quoi ton programme aujourd'hui ?" },
      { ar: "لَا أَفْهَمُ كُلَّ شَيْءٍ.", fr: "Je ne comprends pas tout." },
      { ar: "حَسَنًا، أَفْهَمُ الْآنَ.", fr: "D'accord, je vois maintenant." },
      { ar: "أُرَاجِعُ دُرُوسِي الْآنَ.", fr: "Je révise mes cours, là.", accept: ["الْآنَ أُرَاجِعُ دُرُوسِي"] },
    ],
  },
  {
    id: 2, title: "Le frigo et la cuisine",
    words: [
      { ar: "الثَّلَّاجَةُ", fr: "Le frigo", note: "Mot féminin" },
      { ar: "حَلِيبٌ", fr: "Lait" },
      { ar: "بَيْضٌ", fr: "Œufs" },
      { ar: "خُبْزٌ", fr: "Pain" },
      { ar: "جُبْنٌ", fr: "Fromage" },
      { ar: "زُبْدَةٌ", fr: "Beurre" },
      { ar: "دَجَاجٌ", fr: "Poulet" },
      { ar: "خُضَارٌ", fr: "Légumes" },
      { ar: "فَوَاكِهُ", fr: "Fruits" },
      { ar: "عَصِيرٌ", fr: "Jus" },
      { ar: "مَاءٌ", fr: "Eau" },
      { ar: "أُرِيدُ", fr: "Je veux" },
      { ar: "أَحْتَاجُ إِلَى", fr: "J'ai besoin de", note: "Après إِلَى, la fin du mot change : أَحْتَاجُ إِلَى خُبْزٍ" },
      { ar: "أَشْتَرِي", fr: "J'achète" },
      { ar: "أَطْبُخُ", fr: "Je cuisine" },
      { ar: "أَشْرَبُ", fr: "Je bois" },
      { ar: "أُحِبُّ", fr: "J'aime" },
      { ar: "يُوجَدُ", fr: "Il y a", note: "لَا يُوجَدُ = il n'y a pas" },
      { ar: "هَلْ", fr: "Est-ce que", note: "Se met en tête de question : هَلْ يُوجَدُ حَلِيبٌ؟" },
      { ar: "فَارِغٌ", fr: "Vide", note: "Au féminin : فَارِغَةٌ (الثَّلَّاجَةُ فَارِغَةٌ)" },
      { ar: "شَيْءٌ", fr: "Quelque chose", note: "Comparer avec كُلَّ شَيْءٍ (tout), jour 1" },
      { ar: "قَلِيلٌ", fr: "Peu / Un peu", note: "قَلِيلًا مِنْ… = un peu de…" },
      { ar: "كَثِيرٌ", fr: "Beaucoup" },
      { ar: "فَقَطْ", fr: "Seulement" },
      { ar: "أَيْضًا", fr: "Aussi" },
      { ar: "فِي", fr: "Dans" },
      { ar: "مِنْ", fr: "De / Du", note: "Devient مِنَ devant الْ : مِنَ الْعَصِيرِ" },
      { ar: "جَائِعٌ", fr: "Affamé", note: "أَنَا جَائِعٌ = j'ai faim" },
      { ar: "لَذِيذٌ", fr: "Délicieux" },
      { ar: "بَارِدٌ", fr: "Froid" },
    ],
    phrases: [
      { ar: "هَلْ يُوجَدُ حَلِيبٌ؟", fr: "Est-ce qu'il y a du lait ?" },
      { ar: "لَا يُوجَدُ بَيْضٌ.", fr: "Il n'y a pas d'œufs." },
      { ar: "أَحْتَاجُ إِلَى خُبْزٍ.", fr: "J'ai besoin de pain." },
      { ar: "أُرِيدُ قَلِيلًا مِنَ الْعَصِيرِ.", fr: "Je veux un peu de jus." },
      { ar: "الثَّلَّاجَةُ فَارِغَةٌ!", fr: "Le frigo est vide !" },
    ],
  },
];

const QCM_COUNT = 10;   // questions tirées parmi les mots du jour (Lire, Retrouver)
const QCM_CHOICES = 4;

// ── STATE ──────────────────────────────────────────────────────────────────
// Changer la clé remet la progression à zéro (v2 : contenu définitif de la semaine 1).
const STORE_KEY = 'arabe_fusha_v2';
try { localStorage.removeItem('arabe_fusha_v1'); } catch (e) {}
let S = null;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
S = S || {
  currentDay: 1,
  step: 'words',       // words | exo1 (Lire) | exo2 (Retrouver) | exo3 (Écrire) | done
  completedDays: [],
  exo1Index: 0, exo1Queue: [],   // indices des mots interrogés
  exo2Index: 0, exo2Queue: [],
  exo3Index: 0, exo3Queue: [],   // indices des phrases
};
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function day() { return DAYS.find(d => d.id === S.currentDay) || DAYS[0]; }
function isUnlocked(id) { return id === 1 || S.completedDays.includes(id - 1); }
// Isole les passages arabes d'un texte français pour que le sens de lecture reste juste.
function arInline(text) {
  return text.replace(/[؀-ۿ]+(?:[\s…]+[؀-ۿ]+)*[…؟]?/g, m => `<bdi class="ar" lang="ar">${m}</bdi>`);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('app');
  el.innerHTML = '';
  el.appendChild(renderHeader());
  el.appendChild(renderDayNav());
  el.appendChild(renderProgress());
  el.appendChild(renderStepTabs());
  const content = document.createElement('div');
  if (S.step === 'words') renderWords(content);
  else if (S.step === 'exo1' || S.step === 'exo2') renderQcm(content, S.step);
  else if (S.step === 'exo3') renderExo3(content);
  else if (S.step === 'done') renderDone(content);
  el.appendChild(content);
}

function renderHeader() {
  const h = document.createElement('div');
  h.className = 'header';
  const streak = S.completedDays.length;
  h.innerHTML = `
    <div><h1>Arabe fusha</h1><p>Jour ${day().id} — ${day().title}</p></div>
    <div class="streak">${streak > 0 ? '🔥 ' + streak + ' jour' + (streak > 1 ? 's' : '') : ''}</div>`;
  return h;
}

function renderDayNav() {
  const nav = document.createElement('div');
  nav.className = 'day-nav';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = d.id;
    if (S.completedDays.includes(d.id)) btn.classList.add('done');
    else if (d.id === S.currentDay) btn.classList.add('active');
    if (isUnlocked(d.id)) {
      btn.classList.add('unlocked');
      btn.onclick = () => goDay(d.id);
    }
    nav.appendChild(btn);
  });
  return nav;
}

function renderProgress() {
  const wrap = document.createElement('div');
  wrap.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (S.completedDays.length / DAYS.length * 100) + '%';
  wrap.appendChild(fill);
  return wrap;
}

function renderStepTabs() {
  const steps = ['words', 'exo1', 'exo2', 'exo3'];
  const labels = { words: 'Mots', exo1: 'Lire', exo2: 'Retrouver', exo3: 'Écrire' };
  const order = ['words', 'exo1', 'exo2', 'exo3', 'done'];

  const tabs = document.createElement('div');
  tabs.className = 'step-tabs';
  steps.forEach(step => {
    const t = document.createElement('button');
    t.className = 'step-tab';
    t.textContent = labels[step];
    const stepIdx = order.indexOf(step);
    const curIdx = order.indexOf(S.step);
    if (step === S.step) t.classList.add('active');
    else if (stepIdx < curIdx) { t.classList.add('done-tab'); t.classList.add('reachable'); t.onclick = () => {
      if (QCM[step]) return startQcm(step);
      if (step === 'exo3') return startExo3();
      S.step = step; save(); render();
    }; }
    tabs.appendChild(t);
  });
  return tabs;
}

// WORDS
function renderWords(el) {
  const d = day();

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = `Mots du jour (${d.words.length})`;
  el.appendChild(label);

  const list = document.createElement('div');
  list.className = 'word-list';
  d.words.forEach(w => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="word-main">
        <div class="word-translation">${w.fr}</div>
        ${w.note ? `<div class="word-note">${arInline(w.note)}</div>` : ''}
      </div>
      <div class="word-arabic ar" lang="ar">${w.ar}</div>`;
    list.appendChild(row);
  });
  el.appendChild(list);

  const plabel = document.createElement('div');
  plabel.className = 'section-label';
  plabel.textContent = 'Phrases du jour';
  el.appendChild(plabel);

  const plist = document.createElement('div');
  plist.className = 'phrase-list';
  d.phrases.forEach(ph => {
    const row = document.createElement('div');
    row.className = 'phrase-row';
    row.innerHTML = `
      <div class="phrase-arabic ar" lang="ar">${ph.ar}</div>
      <div class="phrase-translation">${ph.fr}</div>`;
    plist.appendChild(row);
  });
  el.appendChild(plist);

  const btn = document.createElement('button');
  btn.className = 'btn-next-step';
  btn.textContent = 'Continuer → Lire';
  btn.onclick = () => startQcm('exo1');
  el.appendChild(btn);
}

// EXO 1 & 2 — QCM : Lire (arabe → français) et Retrouver (français → arabe)
const QCM = {
  exo1: { label: 'Lire', ask: w => w.ar, answer: w => w.fr, askAr: true, next: () => startQcm('exo2') },
  exo2: { label: 'Retrouver', ask: w => w.fr, answer: w => w.ar, askAr: false, next: () => startExo3() },
};

function startQcm(step) {
  const idx = day().words.map((_, i) => i);
  S[step + 'Queue'] = shuffle(idx).slice(0, QCM_COUNT);
  S[step + 'Index'] = 0;
  S.step = step;
  save(); render();
}

function renderQcm(el, step) {
  const d = day();
  const q = QCM[step];
  const queue = S[step + 'Queue'];
  if (!queue || !queue.length) { startQcm(step); return; }
  if (S[step + 'Index'] >= queue.length) { q.next(); return; }
  const word = d.words[queue[S[step + 'Index']]];
  const others = shuffle(d.words.filter(w => w !== word)).slice(0, QCM_CHOICES - 1);
  const options = shuffle([word, ...others]);
  const advance = () => { S[step + 'Index']++; save(); render(); };

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `${q.label} — ${S[step + 'Index'] + 1} / ${queue.length}`;
  el.appendChild(counter);

  const prompt = document.createElement('div');
  prompt.className = q.askAr ? 'ex1-word ar' : 'ex1-word';
  if (q.askAr) prompt.lang = 'ar';
  prompt.textContent = q.ask(word);
  el.appendChild(prompt);

  const choices = document.createElement('div');
  choices.className = 'choices';
  options.forEach(o => {
    const btn = document.createElement('button');
    btn.className = q.askAr ? 'choice-btn' : 'choice-btn ar';
    if (!q.askAr) btn.lang = 'ar';
    btn.textContent = q.answer(o);
    btn.onclick = () => {
      if (btn.disabled) return;
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      if (o === word) {
        btn.classList.add('correct');
        setTimeout(advance, 700);
      } else {
        btn.classList.add('wrong');
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === q.answer(word)) b.classList.add('correct');
        });
        setTimeout(advance, 1200);
      }
    };
    choices.appendChild(btn);
  });
  el.appendChild(choices);
}

// EXO 3 — ÉCRIRE (français → arabe, clavier arabe)
// Correction tolérante validée par l'essai du sprint 2 : ignore voyelles, variantes de hamza,
// ة/ه, ى/ي, tatweel, caractères invisibles, ponctuation et espaces en trop.
function normalize(s) {
  return s.normalize('NFKC')
    .replace(/[ً-ٰٟۖ-ۭ]/g, '')
    .replace(/ـ/g, '')
    .replace(/[​-‏‪-‮⁦-⁩﻿]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[.,!?؟،؛:;«»"'()\-–—]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function isCorrect(input, phrase) {
  const val = normalize(input);
  return val !== '' && [phrase.ar, ...(phrase.accept || [])].some(a => normalize(a) === val);
}

function startExo3() {
  S.exo3Queue = shuffle(day().phrases.map((_, i) => i));
  S.exo3Index = 0;
  S.step = 'exo3';
  save(); render();
}

function renderExo3(el) {
  const d = day();
  if (!S.exo3Queue || !S.exo3Queue.length) { startExo3(); return; }
  if (S.exo3Index >= S.exo3Queue.length) {
    if (!S.completedDays.includes(d.id)) S.completedDays.push(d.id);
    S.step = 'done'; save(); render(); return;
  }
  const ph = d.phrases[S.exo3Queue[S.exo3Index]];
  const advance = () => { S.exo3Index++; save(); render(); };

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `Écrire — ${S.exo3Index + 1} / ${S.exo3Queue.length}`;
  el.appendChild(counter);

  const prompt = document.createElement('div');
  prompt.className = 'ex3-prompt';
  prompt.innerHTML = `<div class="ex3-prompt-label">Écris en arabe</div>${ph.fr}`;
  el.appendChild(prompt);

  const input = document.createElement('textarea');
  input.className = 'ex3-input ar';
  input.dir = 'rtl';
  input.lang = 'ar';
  input.rows = 2;
  input.placeholder = 'اكتب هنا…';
  input.autocomplete = 'off';
  input.setAttribute('autocorrect', 'off');
  input.autocapitalize = 'off';
  input.spellcheck = false;
  el.appendChild(input);

  const answer = document.createElement('div');
  answer.className = 'ex3-answer ar';
  answer.lang = 'ar';
  answer.textContent = ph.ar;
  answer.hidden = true;
  el.appendChild(answer);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn-check';
  checkBtn.textContent = 'Vérifier';
  el.appendChild(checkBtn);

  const skipBtn = document.createElement('button');
  skipBtn.className = 'btn-skip';
  skipBtn.textContent = 'Voir la réponse';
  el.appendChild(skipBtn);

  let checked = false;
  const reveal = ok => {
    checked = true;
    input.classList.add(ok ? 'correct' : 'wrong');
    input.disabled = true;
    answer.hidden = false;
    checkBtn.textContent = 'Suivant →';
    skipBtn.hidden = true;
  };
  checkBtn.onclick = () => checked ? advance() : reveal(isCorrect(input.value, ph));
  skipBtn.onclick = () => reveal(false);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
  setTimeout(() => input.focus(), 100);
}

function renderDone(el) {
  const d = day();
  const next = DAYS.find(x => x.id === d.id + 1);
  el.innerHTML = `
    <div class="complete-box">
      <h2>Jour ${d.id} terminé !</h2>
      <p>${next ? `Jour ${next.id} débloqué.` : 'Pas encore de jour suivant : il arrivera bientôt.'}</p>
      ${next ? `<button class="btn-complete" onclick="goDay(${next.id})">Jour ${next.id} →</button>` : ''}
    </div>`;
}

// ACTIONS
function goDay(id) {
  if (!isUnlocked(id)) return;
  S.currentDay = id;
  S.step = 'words';
  S.exo1Queue = []; S.exo2Queue = []; S.exo3Queue = [];
  save();
  render();
}

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW non enregistré', err));
}
