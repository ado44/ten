<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Arabe fusha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }
#app { max-width: 520px; margin: 0 auto; padding: 16px 16px 60px; }
.ar { font-family: 'Noto Naskh Arabic', 'Traditional Arabic', 'Segoe UI', serif; direction: rtl; line-height: 1.9; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #222; }
.header h1 { font-size: 17px; font-weight: 700; }
.header p { font-size: 11px; color: #555; margin-top: 2px; }
.streak { font-size: 13px; color: #f0a500; }

/* DAY NAV */
.day-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.day-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #2a2a2a; background: #1a1a1a; color: #333; font-size: 13px; font-weight: 600; cursor: default; display: flex; align-items: center; justify-content: center; }
.day-btn.unlocked { border-color: #3a3a3a; color: #888; cursor: pointer; }
.day-btn.unlocked:hover { border-color: #555; color: #ccc; }
.day-btn.active { border-color: #4a90d9; color: #4a90d9; background: #0d1f2f; }
.day-btn.done { border-color: #2d5a2d; color: #4a8a4a; background: #0d1f0d; }

/* PROGRESS */
.progress-bar { height: 2px; background: #1a1a1a; border-radius: 2px; margin-bottom: 20px; }
.progress-fill { height: 100%; background: #4a90d9; border-radius: 2px; transition: width 0.4s; }

/* STEP TABS */
.step-tabs { display: flex; gap: 0; border: 1px solid #222; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.step-tab { flex: 1; padding: 9px 4px; text-align: center; font-size: 12px; color: #444; background: #111; border: none; cursor: default; }
.step-tab.reachable { color: #666; cursor: pointer; }
.step-tab.active { background: #0d1f2f; color: #4a90d9; }
.step-tab.done-tab { color: #4a8a4a; }

/* SECTION TITLE */
.section-label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

/* WORD LIST */
.word-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }
.word-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #141414; border-radius: 8px; }
.word-row:hover { background: #1a1a1a; }
.word-main { flex: 1; }
.word-translation { font-size: 14px; color: #999; }
.word-note { font-size: 11px; color: #445; margin-top: 3px; font-style: italic; }
.word-arabic { font-size: 24px; color: #e8e8e8; text-align: right; }

/* PHRASE LIST */
.phrase-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 28px; }
.phrase-row { padding: 10px 12px; background: #141414; border-radius: 8px; }
.phrase-row:hover { background: #1a1a1a; }
.phrase-arabic { font-size: 22px; color: #e8e8e8; text-align: right; }
.phrase-translation { font-size: 13px; color: #777; }

/* NEXT STEP BTN */
.btn-next-step { width: 100%; padding: 13px; background: #0d1f2f; border: 1px solid #2a4a6a; color: #4a90d9; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; }
.btn-next-step:hover { background: #1a2a3a; }

/* EXERCISE */
.ex-counter { font-size: 11px; color: #444; margin-bottom: 12px; text-align: right; }

/* EXO 1 — LIRE */
.ex1-word { font-size: 40px; text-align: center; padding: 20px; background: #141414; border-radius: 12px; margin-bottom: 20px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn { padding: 13px 16px; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; color: #ccc; font-size: 14px; cursor: pointer; text-align: left; }
.choice-btn:hover { background: #1a1a1a; border-color: #3a3a3a; }
.choice-btn.correct { background: #0d1f0d; border-color: #2d5a2d; color: #4a8a4a; }
.choice-btn.wrong { background: #1f0d0d; border-color: #5a2d2d; color: #8a4a4a; }
.choice-btn:disabled { cursor: default; }

/* COMPLETE */
.complete-box { text-align: center; padding: 40px 20px; }
.complete-box h2 { font-size: 22px; margin-bottom: 8px; }
.complete-box p { font-size: 14px; color: #555; margin-bottom: 24px; }
.btn-complete { padding: 13px 28px; background: #0d1f0d; border: 1px solid #2d5a2d; color: #4a8a4a; border-radius: 10px; font-size: 15px; cursor: pointer; }
.btn-complete:hover { background: #1a2a1a; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Contenu PROVISOIRE (sprint 1) — le vrai contenu sera choisi au sprint 3.
// words:   { ar (vocalisé), fr, note? }
// phrases: { ar (vocalisé), fr, accept? (autres réponses acceptées, sprint 2) }
const DAYS = [
  {
    id: 1, title: "Noms et adjectifs de base",
    words: [
      { ar: "بَيْتٌ", fr: "Maison" },
      { ar: "كِتَابٌ", fr: "Livre" },
      { ar: "قَلَمٌ", fr: "Stylo" },
      { ar: "بَابٌ", fr: "Porte" },
      { ar: "وَلَدٌ", fr: "Garçon" },
      { ar: "بِنْتٌ", fr: "Fille" },
      { ar: "رَجُلٌ", fr: "Homme" },
      { ar: "اِمْرَأَةٌ", fr: "Femme" },
      { ar: "مَاءٌ", fr: "Eau" },
      { ar: "خُبْزٌ", fr: "Pain" },
      { ar: "يَوْمٌ", fr: "Jour" },
      { ar: "لَيْلٌ", fr: "Nuit" },
      { ar: "شَمْسٌ", fr: "Soleil" },
      { ar: "قَمَرٌ", fr: "Lune" },
      { ar: "مَدِينَةٌ", fr: "Ville" },
      { ar: "طَرِيقٌ", fr: "Chemin / Route" },
      { ar: "سَيَّارَةٌ", fr: "Voiture" },
      { ar: "مَدْرَسَةٌ", fr: "École" },
      { ar: "أَبٌ", fr: "Père" },
      { ar: "أُمٌّ", fr: "Mère" },
      { ar: "أَخٌ", fr: "Frère" },
      { ar: "أُخْتٌ", fr: "Sœur" },
      { ar: "صَدِيقٌ", fr: "Ami" },
      { ar: "طَعَامٌ", fr: "Nourriture" },
      { ar: "وَقْتٌ", fr: "Temps (durée)" },
      { ar: "عَمَلٌ", fr: "Travail" },
      { ar: "كَبِيرٌ", fr: "Grand" },
      { ar: "صَغِيرٌ", fr: "Petit" },
      { ar: "جَدِيدٌ", fr: "Nouveau" },
      { ar: "جَمِيلٌ", fr: "Beau" },
    ],
    phrases: [
      { ar: "هَذَا بَيْتٌ كَبِيرٌ.", fr: "C'est une grande maison." },
      { ar: "هَذِهِ سَيَّارَةٌ جَدِيدَةٌ.", fr: "C'est une nouvelle voiture." },
      { ar: "الْكِتَابُ صَغِيرٌ.", fr: "Le livre est petit." },
      { ar: "أَبِي فِي الْبَيْتِ.", fr: "Mon père est à la maison." },
      { ar: "الْمَدِينَةُ جَمِيلَةٌ.", fr: "La ville est belle." },
    ],
  },
  {
    id: 2, title: "Pronoms et premiers verbes",
    words: [
      { ar: "أَنَا", fr: "Je / Moi" },
      { ar: "أَنْتَ", fr: "Tu (masc.)" },
      { ar: "أَنْتِ", fr: "Tu (fém.)" },
      { ar: "هُوَ", fr: "Il / Lui" },
      { ar: "هِيَ", fr: "Elle" },
      { ar: "نَحْنُ", fr: "Nous" },
      { ar: "ذَهَبَ", fr: "Aller (il est allé)", note: "Les verbes sont donnés au passé, 3e pers. masc. sing." },
      { ar: "أَكَلَ", fr: "Manger (il a mangé)" },
      { ar: "شَرِبَ", fr: "Boire (il a bu)" },
      { ar: "كَتَبَ", fr: "Écrire (il a écrit)" },
    ],
    phrases: [
      { ar: "هُوَ فِي الْمَدْرَسَةِ.", fr: "Il est à l'école." },
      { ar: "نَحْنُ فِي الْبَيْتِ.", fr: "Nous sommes à la maison." },
      { ar: "أَكَلَ الْوَلَدُ الْخُبْزَ.", fr: "Le garçon a mangé le pain." },
      { ar: "شَرِبَتِ الْبِنْتُ الْمَاءَ.", fr: "La fille a bu l'eau." },
      { ar: "أَنَا صَدِيقُكَ.", fr: "Je suis ton ami." },
    ],
  },
];

const EXO1_COUNT = 10;   // questions tirées parmi les mots du jour
const EXO1_CHOICES = 4;

// ── STATE ──────────────────────────────────────────────────────────────────
const STORE_KEY = 'arabe_fusha_v1';
let S = null;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
S = S || {
  currentDay: 1,
  step: 'words',       // words | exo1 | done
  completedDays: [],
  exo1Index: 0,
  exo1Queue: [],       // indices des mots interrogés
};
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function day() { return DAYS.find(d => d.id === S.currentDay) || DAYS[0]; }
function isUnlocked(id) { return id === 1 || S.completedDays.includes(id - 1); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('app');
  el.innerHTML = '';
  el.appendChild(renderHeader());
  el.appendChild(renderDayNav());
  el.appendChild(renderProgress());
  el.appendChild(renderStepTabs());
  const content = document.createElement('div');
  if (S.step === 'words') renderWords(content);
  else if (S.step === 'exo1') renderExo1(content);
  else if (S.step === 'done') renderDone(content);
  el.appendChild(content);
}

function renderHeader() {
  const h = document.createElement('div');
  h.className = 'header';
  const streak = S.completedDays.length;
  h.innerHTML = `
    <div><h1>Arabe fusha</h1><p>Jour ${day().id} — ${day().title}</p></div>
    <div class="streak">${streak > 0 ? '🔥 ' + streak + ' jour' + (streak > 1 ? 's' : '') : ''}</div>`;
  return h;
}

function renderDayNav() {
  const nav = document.createElement('div');
  nav.className = 'day-nav';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = d.id;
    if (S.completedDays.includes(d.id)) btn.classList.add('done');
    else if (d.id === S.currentDay) btn.classList.add('active');
    if (isUnlocked(d.id)) {
      btn.classList.add('unlocked');
      btn.onclick = () => goDay(d.id);
    }
    nav.appendChild(btn);
  });
  return nav;
}

function renderProgress() {
  const wrap = document.createElement('div');
  wrap.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (S.completedDays.length / DAYS.length * 100) + '%';
  wrap.appendChild(fill);
  return wrap;
}

function renderStepTabs() {
  const steps = ['words', 'exo1'];
  const labels = { words: 'Mots', exo1: 'Lire' };
  const order = ['words', 'exo1', 'done'];

  const tabs = document.createElement('div');
  tabs.className = 'step-tabs';
  steps.forEach(step => {
    const t = document.createElement('button');
    t.className = 'step-tab';
    t.textContent = labels[step];
    const stepIdx = order.indexOf(step);
    const curIdx = order.indexOf(S.step);
    if (step === S.step) t.classList.add('active');
    else if (stepIdx < curIdx) { t.classList.add('done-tab'); t.classList.add('reachable'); t.onclick = () => { if (step === 'exo1') return startExo1(); S.step = step; save(); render(); }; }
    tabs.appendChild(t);
  });
  return tabs;
}

// WORDS
function renderWords(el) {
  const d = day();

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = `Mots du jour (${d.words.length})`;
  el.appendChild(label);

  const list = document.createElement('div');
  list.className = 'word-list';
  d.words.forEach(w => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <div class="word-main">
        <div class="word-translation">${w.fr}</div>
        ${w.note ? `<div class="word-note">${w.note}</div>` : ''}
      </div>
      <div class="word-arabic ar" lang="ar">${w.ar}</div>`;
    list.appendChild(row);
  });
  el.appendChild(list);

  const plabel = document.createElement('div');
  plabel.className = 'section-label';
  plabel.textContent = 'Phrases du jour';
  el.appendChild(plabel);

  const plist = document.createElement('div');
  plist.className = 'phrase-list';
  d.phrases.forEach(ph => {
    const row = document.createElement('div');
    row.className = 'phrase-row';
    row.innerHTML = `
      <div class="phrase-arabic ar" lang="ar">${ph.ar}</div>
      <div class="phrase-translation">${ph.fr}</div>`;
    plist.appendChild(row);
  });
  el.appendChild(plist);

  const btn = document.createElement('button');
  btn.className = 'btn-next-step';
  btn.textContent = 'Continuer → Lire';
  btn.onclick = () => startExo1();
  el.appendChild(btn);
}

// EXO 1 — LIRE (arabe → français)
function startExo1() {
  const idx = day().words.map((_, i) => i);
  S.exo1Queue = shuffle(idx).slice(0, EXO1_COUNT);
  S.exo1Index = 0;
  S.step = 'exo1';
  save(); render();
}

function renderExo1(el) {
  const d = day();
  if (!S.exo1Queue || !S.exo1Queue.length) { startExo1(); return; }
  if (S.exo1Index >= S.exo1Queue.length) {
    if (!S.completedDays.includes(d.id)) S.completedDays.push(d.id);
    S.step = 'done'; save(); render(); return;
  }
  const word = d.words[S.exo1Queue[S.exo1Index]];
  const others = shuffle(d.words.filter(w => w !== word)).slice(0, EXO1_CHOICES - 1);
  const options = shuffle([word, ...others]);

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `Lire — ${S.exo1Index + 1} / ${S.exo1Queue.length}`;
  el.appendChild(counter);

  const prompt = document.createElement('div');
  prompt.className = 'ex1-word ar';
  prompt.lang = 'ar';
  prompt.textContent = word.ar;
  el.appendChild(prompt);

  const choices = document.createElement('div');
  choices.className = 'choices';
  options.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = o.fr;
    btn.onclick = () => {
      if (btn.disabled) return;
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      if (o === word) {
        btn.classList.add('correct');
        setTimeout(() => { S.exo1Index++; save(); render(); }, 700);
      } else {
        btn.classList.add('wrong');
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === word.fr) b.classList.add('correct');
        });
        setTimeout(() => { S.exo1Index++; save(); render(); }, 1200);
      }
    };
    choices.appendChild(btn);
  });
  el.appendChild(choices);
}

function renderDone(el) {
  const d = day();
  const next = DAYS.find(x => x.id === d.id + 1);
  el.innerHTML = `
    <div class="complete-box">
      <h2>Jour ${d.id} terminé !</h2>
      <p>${next ? `Jour ${next.id} débloqué.` : 'Pas encore de jour suivant : il arrivera bientôt.'}</p>
      ${next ? `<button class="btn-complete" onclick="goDay(${next.id})">Jour ${next.id} →</button>` : ''}
    </div>`;
}

// ACTIONS
function goDay(id) {
  if (!isUnlocked(id)) return;
  S.currentDay = id;
  S.step = 'words';
  S.exo1Index = 0;
  S.exo1Queue = [];
  save();
  render();
}

render();

// ── HORS LIGNE ─────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW non enregistré', err));
}
</script>
</body>
</html>
