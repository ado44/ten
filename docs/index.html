function save() { localStorage.setItem('arabe10j_v2', JSON.stringify(S)); }
function day() { return DAYS[S.currentDay - 1]; }
function isUnlocked(id) { return id === 1 || S.completedDays.includes(id - 1); }

// ── AUDIO ──────────────────────────────────────────────────────────────────
let currentAudio = null;
function playAudio(file, btn) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.btn-play.playing, .ex1-audio-btn.playing, .btn-dialogue-audio.playing')
    .forEach(b => b.classList.remove('playing'));

  const a = new Audio(file);
  currentAudio = a;
  if (btn) btn.classList.add('playing');
  a.play().catch(() => { if (btn) { btn.classList.remove('playing'); } });
  a.onended = () => { if (btn) btn.classList.remove('playing'); currentAudio = null; };
}
function wordAudio(slug, btn) { playAudio(`words/${slug}.mp3`, btn); }
function phraseAudio(slug, btn) { playAudio(`phrases/${slug}.mp3`, btn); }
function dialogueAudio(slug, btn) { playAudio(`dialogues/${slug}.mp3`, btn); }

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('app');
  el.innerHTML = '';
  el.appendChild(renderHeader());
  el.appendChild(renderDayNav());
  el.appendChild(renderProgress());
  el.appendChild(renderStepTabs());
  const content = document.createElement('div');
  if (S.step === 'words') renderWords(content);
  else if (S.step === 'exo1') renderExo1(content);
  else if (S.step === 'exo2') renderExo2(content);
  else if (S.step === 'dialogue') renderDialogue(content);
  else if (S.step === 'done') renderDone(content);
  el.appendChild(content);
}

function renderHeader() {
  const h = document.createElement('div');
  h.className = 'header';
  const streak = S.completedDays.length;
  h.innerHTML = `
    <div><h1>Arabe Égyptien</h1><p>10 jours · Ammiya cairote</p></div>
    <div class="streak">${streak > 0 ? '🔥 ' + streak + ' jour' + (streak > 1 ? 's' : '') : ''}</div>`;
  return h;
}

function renderDayNav() {
  const nav = document.createElement('div');
  nav.className = 'day-nav';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = d.id;
    if (S.completedDays.includes(d.id)) btn.classList.add('done');
    else if (d.id === S.currentDay) btn.classList.add('active');
    if (isUnlocked(d.id)) {
      btn.classList.add('unlocked');
      btn.onclick = () => goDay(d.id);
    }
    nav.appendChild(btn);
  });
  return nav;
}

function renderProgress() {
  const wrap = document.createElement('div');
  wrap.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (S.completedDays.length / 10 * 100) + '%';
  wrap.appendChild(fill);
  return wrap;
}

function renderStepTabs() {
  const d = day();
  const hasDialogue = !!d.dialogue;
  const steps = hasDialogue
    ? ['words', 'exo1', 'exo2', 'dialogue']
    : ['words', 'exo1', 'exo2'];
  const labels = { words: 'Mots', exo1: 'Écoute', exo2: 'Écris', dialogue: 'Dialogue' };
  const order = ['words', 'exo1', 'exo2', 'dialogue', 'done'];

  const tabs = document.createElement('div');
  tabs.className = 'step-tabs';
  steps.forEach(step => {
    const t = document.createElement('button');
    t.className = 'step-tab';
    t.textContent = labels[step];
    const stepIdx = order.indexOf(step);
    const curIdx = order.indexOf(S.step);
    if (step === S.step) t.classList.add('active');
    else if (stepIdx < curIdx) { t.classList.add('done-tab'); t.classList.add('reachable'); t.onclick = () => { S.step = step; save(); render(); }; }
    tabs.appendChild(t);
  });
  return tabs;
}

// WORDS
function renderWords(el) {
  const d = day();
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = `Jour ${d.id} — ${d.title}`;
  el.appendChild(label);

  const hasBiyi = d.words.some(w => w.p.toLowerCase().startsWith('biyi') || w.p.toLowerCase().startsWith('bit'));
  if (hasBiyi) {
    const note = document.createElement('div');
    note.className = 'biyi-note';
    note.innerHTML = `<span>biyi-</span> = préfixe du présent continu, 3ème personne (il/elle). <span>biyishoof</span> = il voit, <span>biyigi</span> = il vient, etc.`;
    el.appendChild(note);
  }

  const list = document.createElement('div');
  list.className = 'word-list';
  d.words.forEach(w => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <button class="btn-play" onclick="wordAudio('${w.audio}', this)" title="Écouter">▶</button>
      <div class="word-main">
        <div class="word-phonetic">${w.p}</div>
        ${w.ar ? `<div class="word-arabic">${w.ar}</div>` : ''}
      </div>
      <span class="word-translation">${w.t}</span>`;
    list.appendChild(row);
  });
  el.appendChild(list);

  const plabel = document.createElement('div');
  plabel.className = 'section-label';
  plabel.textContent = 'Phrases du jour';
  el.appendChild(plabel);

  const plist = document.createElement('div');
  plist.className = 'phrase-list';
  d.phrases.forEach(ph => {
    const row = document.createElement('div');
    row.className = 'phrase-row';
    row.innerHTML = `
      <button class="btn-play" onclick="phraseAudio('${ph.audio}', this)" title="Écouter">▶</button>
      <div class="phrase-texts">
        <div class="phrase-phonetic">${ph.p}</div>
        <div class="phrase-translation">${ph.t}</div>
      </div>`;
    plist.appendChild(row);
  });
  el.appendChild(plist);

  const btn = document.createElement('button');
  btn.className = 'btn-next-step';
  btn.textContent = 'Continuer → Exercice écoute';
  btn.onclick = () => { S.step = 'exo1'; S.exo1Index = 0; S.exo1Done = false; save(); render(); };
  el.appendChild(btn);
}

// EXO 1 — RECONNAÎTRE
function renderExo1(el) {
  const d = day();
  const exos = d.exo1;
  if (S.exo1Index >= exos.length) {
    S.step = 'exo2'; S.exo2Index = 0; save(); render(); return;
  }
  const ex = exos[S.exo1Index];

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `Exercice écoute — ${S.exo1Index + 1} / ${exos.length}`;
  el.appendChild(counter);

  const audioBtn = document.createElement('button');
  audioBtn.className = 'ex1-audio-btn';
  audioBtn.innerHTML = '▶ &nbsp; Écouter le mot';
  audioBtn.onclick = () => wordAudio(ex.audio, audioBtn);
  el.appendChild(audioBtn);

  const choices = document.createElement('div');
  choices.className = 'choices';
  const shuffled = [...ex.choices].sort(() => Math.random() - 0.5);
  shuffled.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => {
      if (btn.disabled) return;
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      if (c === ex.correct) {
        btn.classList.add('correct');
        setTimeout(() => { S.exo1Index++; save(); render(); }, 700);
      } else {
        btn.classList.add('wrong');
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === ex.correct) b.classList.add('correct');
        });
        setTimeout(() => { S.exo1Index++; save(); render(); }, 1200);
      }
    };
    choices.appendChild(btn);
  });
  el.appendChild(choices);
}

// EXO 2 — TRADUCTION LIBRE
function renderExo2(el) {
  const d = day();
  const exos = d.exo2;
  if (S.exo2Index >= exos.length) {
    S.step = d.dialogue ? 'dialogue' : 'done'; save(); render(); return;
  }
  const ex = exos[S.exo2Index];

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `Exercice écriture — ${S.exo2Index + 1} / ${exos.length}`;
  el.appendChild(counter);

  const prompt = document.createElement('div');
  prompt.className = 'ex2-prompt';
  prompt.innerHTML = `<div class="ex2-prompt-label">Traduis en phonétique</div>${ex.fr}`;
  el.appendChild(prompt);

  const input = document.createElement('input');
  input.className = 'ex2-input';
  input.type = 'text';
  input.placeholder = 'Ta réponse en phonétique...';
  input.autocomplete = 'off';
  input.autocorrect = 'off';
  input.autocapitalize = 'off';
  input.spellcheck = false;
  el.appendChild(input);

  const answer = document.createElement('div');
  answer.className = 'ex2-answer';
  answer.textContent = '✓ ' + ex.answer;
  el.appendChild(answer);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn-check';
  checkBtn.textContent = 'Vérifier';
  el.appendChild(checkBtn);

  const skipBtn = document.createElement('button');
  skipBtn.className = 'btn-skip';
  skipBtn.textContent = 'Passer →';
  el.appendChild(skipBtn);

  let checked = false;
  const check = () => {
    if (checked) { S.exo2Index++; save(); render(); return; }
    checked = true;
    const val = input.value.trim().toLowerCase().replace(/['']/g, "'");
    const exp = ex.answer.toLowerCase();
    const ok = val === exp || exp.includes(val) && val.length > 3;
    input.classList.add(ok ? 'correct' : 'wrong');
    answer.style.display = 'block';
    checkBtn.textContent = 'Suivant →';
    input.disabled = true;
  };

  checkBtn.onclick = check;
  skipBtn.onclick = () => { S.exo2Index++; save(); render(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  setTimeout(() => input.focus(), 100);
}

// DIALOGUE
function renderDialogue(el) {
  const d = day().dialogue;
  if (!d) { renderDone(el); return; }

  const box = document.createElement('div');
  box.className = 'dialogue-box';

  const tag = document.createElement('div');
  tag.className = 'dialogue-tag';
  tag.textContent = d.tag;
  box.appendChild(tag);

  d.lines.forEach(l => {
    const line = document.createElement('div');
    line.className = 'dialogue-line';
    line.innerHTML = `<div class="dialogue-speaker">${l.s}</div><div class="dialogue-text">${l.t}</div>`;
    box.appendChild(line);
  });

  const audioBtn = document.createElement('button');
  audioBtn.className = 'btn-dialogue-audio';
  audioBtn.innerHTML = '▶ &nbsp; Écouter le dialogue';
  audioBtn.onclick = () => dialogueAudio(d.audio, audioBtn);
  box.appendChild(audioBtn);
  box.insertAdjacentHTML('beforeend', `<div class="audio-missing">Fichier : audio/dialogues/${d.audio}.mp3</div>`);

  const showTrad = document.createElement('button');
  showTrad.className = 'btn-show-trad';
  showTrad.textContent = 'Voir la traduction';
  box.appendChild(showTrad);

  const tradBlock = document.createElement('div');
  tradBlock.className = 'trad-block';
  d.trad.forEach(t => {
    const line = document.createElement('div');
    line.className = 'trad-line';
    line.textContent = '— ' + t;
    tradBlock.appendChild(line);
  });
  box.appendChild(tradBlock);
  showTrad.onclick = () => {
    const open = tradBlock.style.display === 'block';
    tradBlock.style.display = open ? 'none' : 'block';
    showTrad.textContent = open ? 'Voir la traduction' : 'Cacher la traduction';
  };

  if (d.newWords.length) {
    const nw = document.createElement('div');
    nw.className = 'new-words-block';
    nw.innerHTML = `<div class="new-words-title">Mots hors liste</div>`;
    d.newWords.forEach(w => {
      const row = document.createElement('div');
      row.className = 'new-word-row';
      row.innerHTML = `<span>${w.w}</span> → ${w.m}`;
      nw.appendChild(row);
    });
    box.appendChild(nw);
  }

  el.appendChild(box);

  const btn = document.createElement('button');
  btn.className = 'btn-next-step';
  btn.textContent = `Terminer le jour ${day().id} →`;
  btn.onclick = () => completeDay();
  el.appendChild(btn);
}

function renderDone(el) {
  const d = day();
  const isLast = d.id === 10;
  el.innerHTML = `
    <div class="complete-box">
      <h2>${isLast ? '🎉 10 jours terminés !' : `Jour ${d.id} terminé !`}</h2>
      <p>${isLast ? 'Tu as complété le programme. Bonne chance pour les vraies conversations !' : `Jour ${d.id + 1} débloqué.`}</p>
      ${!isLast ? `<button class="btn-complete" onclick="completeDay()">Jour ${d.id + 1} →</button>` : ''}
    </div>`;
}

// ACTIONS
function completeDay() {
  const id = day().id;
  if (!S.completedDays.includes(id)) S.completedDays.push(id);
  if (id < 10) {
    S.currentDay = id + 1;
    S.step = 'words';
    S.exo1Index = 0;
    S.exo2Index = 0;
  } else {
    S.step = 'done';
  }
  save();
  render();
}

function goDay(id) {
  if (!isUnlocked(id)) return;
  S.currentDay = id;
  S.step = 'words';
  S.exo1Index = 0;
  S.exo2Index = 0;
  save();
  render();
}

render();
</script>
</body>
</html>
