<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Arabe fusha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }
#app { max-width: 520px; margin: 0 auto; padding: 16px 16px 60px; }
.ar { font-family: 'Noto Naskh Arabic', 'Traditional Arabic', 'Segoe UI', serif; direction: rtl; line-height: 1.9; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #222; }
.header h1 { font-size: 17px; font-weight: 700; }
.header p { font-size: 11px; color: #555; margin-top: 2px; }
.streak { font-size: 13px; color: #f0a500; }

/* DAY NAV */
.day-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.day-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #2a2a2a; background: #1a1a1a; color: #333; font-size: 13px; font-weight: 600; cursor: default; display: flex; align-items: center; justify-content: center; }
.day-btn.unlocked { border-color: #3a3a3a; color: #888; cursor: pointer; }
.day-btn.unlocked:hover { border-color: #555; color: #ccc; }
.day-btn.active { border-color: #4a90d9; color: #4a90d9; background: #0d1f2f; }
.day-btn.done { border-color: #2d5a2d; color: #4a8a4a; background: #0d1f0d; }

/* PROGRESS */
.progress-bar { height: 2px; background: #1a1a1a; border-radius: 2px; margin-bottom: 20px; }
.progress-fill { height: 100%; background: #4a90d9; border-radius: 2px; transition: width 0.4s; }

/* STEP TABS */
.step-tabs { display: flex; gap: 0; border: 1px solid #222; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.step-tab { flex: 1; padding: 9px 4px; text-align: center; font-size: 12px; color: #444; background: #111; border: none; cursor: default; }
.step-tab.reachable { color: #666; cursor: pointer; }
.step-tab.active { background: #0d1f2f; color: #4a90d9; }
.step-tab.done-tab { color: #4a8a4a; }

/* SECTION TITLE */
.section-label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

/* WORD LIST */
.word-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }
.word-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #141414; border-radius: 8px; }
.word-row:hover { background: #1a1a1a; }
.word-main { flex: 1; }
.word-translation { font-size: 14px; color: #999; }
.word-note { font-size: 13px; color: #77808c; margin-top: 3px; line-height: 1.6; }
.word-arabic { font-size: 24px; color: #e8e8e8; text-align: right; }

/* PHRASE LIST */
.phrase-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 28px; }
.phrase-row { padding: 10px 12px; background: #141414; border-radius: 8px; }
.phrase-row:hover { background: #1a1a1a; }
.phrase-arabic { font-size: 22px; color: #e8e8e8; text-align: right; }
.phrase-translation { font-size: 13px; color: #777; }

/* NEXT STEP BTN */
.btn-next-step { width: 100%; padding: 13px; background: #0d1f2f; border: 1px solid #2a4a6a; color: #4a90d9; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; }
.btn-next-step:hover { background: #1a2a3a; }

/* EXERCISE */
.ex-counter { font-size: 11px; color: #444; margin-bottom: 12px; text-align: right; }

/* EXO 1 — LIRE */
.ex1-word { font-size: 40px; text-align: center; padding: 20px; background: #141414; border-radius: 12px; margin-bottom: 20px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn { padding: 13px 16px; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; color: #ccc; font-size: 14px; cursor: pointer; text-align: left; }
.choice-btn:hover { background: #1a1a1a; border-color: #3a3a3a; }
.choice-btn.correct { background: #0d1f0d; border-color: #2d5a2d; color: #4a8a4a; }
.choice-btn.wrong { background: #1f0d0d; border-color: #5a2d2d; color: #8a4a4a; }
.choice-btn:disabled { cursor: default; }
.choice-btn.ar { text-align: right; font-size: 22px; padding: 6px 16px; }

/* EXO 3 — ÉCRIRE */
.ex3-prompt { font-size: 16px; color: #ccc; text-align: center; padding: 20px; background: #141414; border-radius: 12px; margin-bottom: 16px; }
.ex3-prompt-label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.ex3-input { width: 100%; resize: none; background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 14px; color: #e8e8e8; font-size: 22px; outline: none; margin-bottom: 10px; }
.ex3-input:focus { border-color: #4a90d9; }
.ex3-input.correct { border-color: #2d5a2d; background: #0d1f0d; }
.ex3-input.wrong { border-color: #5a2d2d; background: #1f0d0d; }
.ex3-answer { font-size: 22px; color: #4a8a4a; margin-bottom: 12px; padding: 6px 12px; background: #0d1f0d; border-radius: 8px; text-align: right; }
.btn-check { width: 100%; padding: 12px; background: #141414; border: 1px solid #2a2a2a; color: #888; border-radius: 10px; font-size: 14px; cursor: pointer; }
.btn-check:hover { border-color: #4a90d9; color: #4a90d9; }
.btn-skip { width: 100%; padding: 10px; background: transparent; border: none; color: #555; font-size: 13px; cursor: pointer; margin-top: 4px; }
.btn-skip:hover { color: #888; }

/* COMPLETE */
.complete-box { text-align: center; padding: 40px 20px; }
.complete-box h2 { font-size: 22px; margin-bottom: 8px; }
.complete-box p { font-size: 14px; color: #555; margin-bottom: 24px; }
.btn-complete { padding: 13px 28px; background: #0d1f0d; border: 1px solid #2d5a2d; color: #4a8a4a; border-radius: 10px; font-size: 15px; cursor: pointer; }
.btn-complete:hover { background: #1a2a1a; }

/* MODE FUSHA | CORAN */
.mode-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid #222; border-radius: 999px; margin-bottom: 16px; }
.mode-switch button { flex: 1; min-height: 36px; border: none; border-radius: 999px; background: transparent; color: #666; font-size: 13px; cursor: pointer; }
.mode-switch button.active { background: #0d1f2f; color: #4a90d9; }

/* CORAN */
@font-face { font-family: 'Amiri Quran App'; src: url('fonts/amiri-quran-arabic.woff2') format('woff2'); font-display: swap; }
#app { --qfont: 'Amiri Quran App', 'Noto Naskh Arabic', serif; }
#app[data-qfont="system"] { --qfont: system-ui, sans-serif; }
.quran { font-family: var(--qfont); direction: rtl; line-height: 2.2; }
.q-word-arabic { font-size: 30px; }
.q-meta { font-size: 12px; color: #667; margin-top: 2px; }
.q-meta .quran { font-size: 18px; line-height: 1.6; }
.q-hint { font-size: 12px; color: #667; line-height: 1.5; margin-bottom: 12px; }
.q-empty { font-size: 14px; color: #888; line-height: 1.6; padding: 24px 0; }
.q-error { font-size: 13px; color: #d46a6a; margin-top: 8px; }
.verse { direction: rtl; display: flex; flex-wrap: wrap; gap: 2px 8px; background: #141414; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.vw { font-family: var(--qfont); font-size: 28px; line-height: 2.1; background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 6px; color: #e8e8e8; padding: 0 3px; cursor: pointer; }
.vw.new { color: #6fb0f0; border-bottom-color: #2a4a6a; }
.vw.unknown { color: #6a6a6a; }
.vw.selected { background: #1a2a3a; }
.detail { display: flex; flex-direction: column; gap: 6px; background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.seg-row { display: flex; align-items: baseline; gap: 12px; }
.seg-ar { font-family: var(--qfont); font-size: 24px; direction: rtl; min-width: 70px; text-align: right; }
.seg-fr { flex: 1; font-size: 14px; color: #ccc; }
.seg-kind { font-size: 11px; color: #667; }
.seg-en { font-size: 12px; color: #667; border-top: 1px solid #1e1e1e; padding-top: 6px; }
.badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #1a1a1a; color: #777; margin-left: 8px; vertical-align: middle; }
.badge.new { background: #0d1f2f; color: #4a90d9; }
.badge.known, .badge.fusha { background: #0d1f0d; color: #4a8a4a; }
.import-box { display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
.import-box h1 { font-size: 17px; }
.import-box p { font-size: 14px; color: #999; line-height: 1.6; }
.file-btn { display: block; text-align: center; }
.q-footer { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid #1e1e1e; font-size: 12px; color: #666; line-height: 1.6; }
.q-footer a { color: #4a90d9; }
.font-toggle { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.font-toggle button { min-height: 34px; padding: 0 12px; border: 1px solid #2a2a2a; border-radius: 999px; background: #141414; color: #888; font-size: 12px; cursor: pointer; }
.font-toggle button.active { border-color: #2a4a6a; background: #0d1f2f; color: #4a90d9; }

/* LECTURE */
.rule-card { background: #141414; border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
.rule-title { font-size: 14px; font-weight: 600; color: #4a90d9; }
.rule-text { font-size: 14px; color: #bbb; line-height: 1.7; }
.rule-ex { font-size: 22px; color: #e8e8e8; text-align: right; }
.reading { background: #141414; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; text-align: right; }
.reading-line { font-size: 24px; line-height: 2.2; color: #e8e8e8; margin-bottom: 6px; }
.rule-text bdi { font-size: 20px; }
.rw-wrap { white-space: nowrap; }
.rw { font: inherit; color: inherit; background: transparent; border: none; border-radius: 6px; padding: 0 1px; cursor: pointer; }
.rw.selected { background: #1a2a3a; }
.rw-full { font-size: 30px; text-align: right; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Contenu : voir « Règles de contenu » et « Mots déjà connus » dans SPRINTS.md.
// words:   { ar (vocalisé), fr, note? }
// phrases: { ar (vocalisé), fr, accept? (autres réponses acceptées) }
const DAYS = [
  {
    id: 1, title: "Le réveil et le programme du jour",
    words: [
      { ar: "أَسْتَيْقِظُ", fr: "Je me réveille" },
      { ar: "أَنَامُ", fr: "Je dors" },
      { ar: "جَيِّدًا", fr: "Bien" },
      { ar: "بِصَرَاحَةٍ", fr: "Franchement" },
      { ar: "وَأَنْتَ؟", fr: "Et toi ?" },
      { ar: "حَسَنًا", fr: "Bon / D'accord", note: "Pour acquiescer ou gagner du temps : حَسَنًا… أَفْهَمُ" },
      { ar: "أَفْهَمُ", fr: "Je comprends", note: "لَا أَفْهَمُ = je ne comprends pas" },
      { ar: "كُلَّ شَيْءٍ", fr: "Tout" },
      { ar: "مَا مَعْنَى…؟", fr: "C'est quoi un… ? / Que veut dire… ?" },
      { ar: "أَعْرِفُ", fr: "Je sais", note: "لَا أَعْرِفُ = je ne sais pas" },
      { ar: "مَاذَا", fr: "Quoi", note: "Devant un nom, on dit مَا : مَا بَرْنَامَجُكَ؟" },
      { ar: "أَيْنَ", fr: "Où" },
      { ar: "الْيَوْمَ", fr: "Aujourd'hui", note: "Vient de يَوْمٌ (jour), déjà connu" },
      { ar: "الْآنَ", fr: "Maintenant" },
      { ar: "بَعْدَ قَلِيلٍ", fr: "Tout à l'heure" },
      { ar: "لَاحِقًا", fr: "Plus tard" },
      { ar: "لَيْسَ بَعْدُ", fr: "Pas encore", note: "Réponse toute faite · à ne pas confondre avec بَعْدَ قَلِيلٍ (tout à l'heure)" },
      { ar: "ـِي", fr: "Mon / Ma / Mes", note: "Se colle au nom : دُرُوسِي = mes cours" },
      { ar: "ـكَ", fr: "Ton / Ta / Tes", note: "Se colle au nom : بَرْنَامَجُكَ = ton programme" },
      { ar: "بَرْنَامَجٌ", fr: "Programme" },
      { ar: "أُرَاجِعُ", fr: "Je révise" },
      { ar: "دُرُوسٌ", fr: "Cours" },
      { ar: "وَاجِبَاتٌ", fr: "Devoirs" },
      { ar: "أَحُلُّ", fr: "Je fais (les devoirs)", note: "أَحُلُّ وَاجِبَاتِي = je fais mes devoirs" },
      { ar: "آكُلُ", fr: "Je mange" },
      { ar: "فِي الْخَارِجِ", fr: "Dehors" },
      { ar: "أَذْهَبُ", fr: "Je vais" },
      { ar: "ثُمَّ", fr: "Puis" },
      { ar: "لَكِنْ", fr: "Mais" },
      { ar: "رُبَّمَا", fr: "Peut-être" },
    ],
    phrases: [
      { ar: "أَسْتَيْقِظُ الْآنَ. وَأَنْتَ؟", fr: "Je me réveille là. Et toi ?" },
      { ar: "مَا بَرْنَامَجُكَ الْيَوْمَ؟", fr: "C'est quoi ton programme aujourd'hui ?" },
      { ar: "لَا أَفْهَمُ كُلَّ شَيْءٍ.", fr: "Je ne comprends pas tout." },
      { ar: "حَسَنًا، أَفْهَمُ الْآنَ.", fr: "D'accord, je vois maintenant." },
      { ar: "أُرَاجِعُ دُرُوسِي الْآنَ.", fr: "Je révise mes cours, là.", accept: ["الْآنَ أُرَاجِعُ دُرُوسِي"] },
    ],
  },
  {
    id: 2, title: "Le frigo et la cuisine",
    words: [
      { ar: "الثَّلَّاجَةُ", fr: "Le frigo", note: "Mot féminin" },
      { ar: "حَلِيبٌ", fr: "Lait" },
      { ar: "بَيْضٌ", fr: "Œufs" },
      { ar: "خُبْزٌ", fr: "Pain" },
      { ar: "جُبْنٌ", fr: "Fromage" },
      { ar: "زُبْدَةٌ", fr: "Beurre" },
      { ar: "دَجَاجٌ", fr: "Poulet" },
      { ar: "خُضَارٌ", fr: "Légumes" },
      { ar: "فَوَاكِهُ", fr: "Fruits" },
      { ar: "عَصِيرٌ", fr: "Jus" },
      { ar: "مَاءٌ", fr: "Eau" },
      { ar: "أُرِيدُ", fr: "Je veux" },
      { ar: "أَحْتَاجُ إِلَى", fr: "J'ai besoin de", note: "Après إِلَى, la fin du mot change : أَحْتَاجُ إِلَى خُبْزٍ" },
      { ar: "أَشْتَرِي", fr: "J'achète" },
      { ar: "أَطْبُخُ", fr: "Je cuisine" },
      { ar: "أَشْرَبُ", fr: "Je bois" },
      { ar: "أُحِبُّ", fr: "J'aime" },
      { ar: "يُوجَدُ", fr: "Il y a", note: "لَا يُوجَدُ = il n'y a pas" },
      { ar: "هَلْ", fr: "Est-ce que", note: "Se met en tête de question : هَلْ يُوجَدُ حَلِيبٌ؟" },
      { ar: "فَارِغٌ", fr: "Vide", note: "Au féminin : فَارِغَةٌ (الثَّلَّاجَةُ فَارِغَةٌ)" },
      { ar: "شَيْءٌ", fr: "Quelque chose", note: "Comparer avec كُلَّ شَيْءٍ (tout), jour 1" },
      { ar: "قَلِيلٌ", fr: "Peu / Un peu", note: "قَلِيلًا مِنْ… = un peu de…" },
      { ar: "كَثِيرٌ", fr: "Beaucoup" },
      { ar: "فَقَطْ", fr: "Seulement" },
      { ar: "أَيْضًا", fr: "Aussi" },
      { ar: "فِي", fr: "Dans" },
      { ar: "مِنْ", fr: "De / Du", note: "Devient مِنَ devant الْ : مِنَ الْعَصِيرِ" },
      { ar: "جَائِعٌ", fr: "Affamé", note: "أَنَا جَائِعٌ = j'ai faim" },
      { ar: "لَذِيذٌ", fr: "Délicieux" },
      { ar: "بَارِدٌ", fr: "Froid" },
    ],
    phrases: [
      { ar: "هَلْ يُوجَدُ حَلِيبٌ؟", fr: "Est-ce qu'il y a du lait ?" },
      { ar: "لَا يُوجَدُ بَيْضٌ.", fr: "Il n'y a pas d'œufs." },
      { ar: "أَحْتَاجُ إِلَى خُبْزٍ.", fr: "J'ai besoin de pain." },
      { ar: "أُرِيدُ قَلِيلًا مِنَ الْعَصِيرِ.", fr: "Je veux un peu de jus." },
      { ar: "الثَّلَّاجَةُ فَارِغَةٌ!", fr: "Le frigo est vide !" },
    ],
  },
];

const QCM_COUNT = 10;   // questions tirées parmi les mots du jour (Lire, Retrouver)
const QCM_CHOICES = 4;

// ── STATE ──────────────────────────────────────────────────────────────────
// Changer la clé remet la progression à zéro (v2 : contenu définitif de la semaine 1).
const STORE_KEY = 'arabe_fusha_v2';
try { localStorage.removeItem('arabe_fusha_v1'); } catch (e) {}
let S = null;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
S = S || {
  currentDay: 1,
  step: 'words',       // words | exo1 (Lire) | exo2 (Retrouver) | exo3 (Écrire) | done
  completedDays: [],
  exo1Index: 0, exo1Queue: [],   // indices des mots interrogés
  exo2Index: 0, exo2Queue: [],
  exo3Index: 0, exo3Queue: [],   // indices des phrases
};
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

// Préférences communes : volet affiché et police du Coran.
const PREFS_KEY = 'arabe_prefs_v1';
let PREFS = null;
try { PREFS = JSON.parse(localStorage.getItem(PREFS_KEY)); } catch (e) {}
PREFS = Object.assign({ mode: 'fusha', qfont: 'amiri' }, PREFS);
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {} }

function renderModeSwitch() {
  const sw = document.createElement('div');
  sw.className = 'mode-switch';
  [['fusha', 'Fusha'], ['coran', 'Coran'], ['lecture', 'Lecture']].forEach(([mode, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (PREFS.mode === mode) b.classList.add('active');
    b.onclick = () => { PREFS.mode = mode; savePrefs(); render(); };
    sw.appendChild(b);
  });
  return sw;
}
function day() { return DAYS.find(d => d.id === S.currentDay) || DAYS[0]; }
function isUnlocked(id) { return id === 1 || S.completedDays.includes(id - 1); }
// Isole les passages arabes d'un texte français pour que le sens de lecture reste juste.
function arInline(text) {
  return text.replace(/[؀-ۿ]+(?:[\s…]+[؀-ۿ]+)*[…؟]?/g, m => `<bdi class="ar" lang="ar">${m}</bdi>`);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const el = document.getElementById('app');
  el.innerHTML = '';
  el.dataset.qfont = PREFS.qfont;
  el.appendChild(renderModeSwitch());
  if (PREFS.mode === 'coran') { renderCoran(el); return; }
  if (PREFS.mode === 'lecture') { renderLecture(el); return; }
  el.appendChild(renderHeader());
  el.appendChild(renderDayNav());
  el.appendChild(renderProgress());
  el.appendChild(renderStepTabs());
  const content = document.createElement('div');
  if (S.step === 'words') renderWords(content);
  else if (S.step === 'exo1' || S.step === 'exo2') renderQcm(content, S.step);
  else if (S.step === 'exo3') renderExo3(content);
  else if (S.step === 'done') renderDone(content);
  el.appendChild(content);
}

function renderHeader() {
  const h = document.createElement('div');
  h.className = 'header';
  const streak = S.completedDays.length;
  h.innerHTML = `
    <div><h1>Arabe fusha</h1><p>Jour ${day().id} — ${day().title}</p></div>

  return h;
}

// EXO 1 & 2 — QCM : Lire (arabe → français) et Retrouver (français → arabe)
const QCM = {
  exo1: { label: 'Lire', ask: w => w.ar, answer: w => w.fr, askAr: true, next: () => startQcm('exo2') },
  exo2: { label: 'Retrouver', ask: w => w.fr, answer: w => w.ar, askAr: false, next: () => startExo3() },
};

function startQcm(step) {
  const idx = day().words.map((_, i) => i);
  S[step + 'Queue'] = shuffle(idx).slice(0, QCM_COUNT);
  S[step + 'Index'] = 0;
  S.step = step;
  save(); render();
}

function renderQcm(el, step) {
  const d = day();
  const q = QCM[step];
  const queue = S[step + 'Queue'];
  if (!queue || !queue.length) { startQcm(step); return; }
  if (S[step + 'Index'] >= queue.length) { q.next(); return; }
  const word = d.words[queue[S[step + 'Index']]];
  const others = shuffle(d.words.filter(w => w !== word)).slice(0, QCM_CHOICES - 1);
  renderQuestion(el, {
    counter: `${q.label} — ${S[step + 'Index'] + 1} / ${queue.length}`,
    prompt: q.ask(word), promptClass: q.askAr ? 'ar' : '',
    options: shuffle([word, ...others]), correct: word, answer: q.answer,
    choiceClass: q.askAr ? '' : 'ar',
    advance: () => { S[step + 'Index']++; save(); render(); },
  });
}

// Question à choix : commune aux QCM fusha et au QCM du Coran.
function renderQuestion(el, { counter, prompt, promptClass, options, correct, answer, choiceClass, advance }) {
  const c = document.createElement('div');
  c.className = 'ex-counter';
  c.textContent = counter;
  el.appendChild(c);

  const p = document.createElement('div');
  p.className = 'ex1-word ' + promptClass;
  if (promptClass) p.lang = 'ar';
  p.textContent = prompt;
  el.appendChild(p);

  const choices = document.createElement('div');
  choices.className = 'choices';
  options.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn ' + choiceClass;
    if (choiceClass) btn.lang = 'ar';
    btn.textContent = answer(o);
    btn.onclick = () => {
      if (btn.disabled) return;
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      if (o === correct) {
        btn.classList.add('correct');
        setTimeout(advance, 700);
      } else {
        btn.classList.add('wrong');
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === answer(correct)) b.classList.add('correct');
        });
        setTimeout(advance, 1200);
      }
    };
    choices.appendChild(btn);
  });
  el.appendChild(choices);
}

// EXO 3 — ÉCRIRE (français → arabe, clavier arabe)
// Correction tolérante validée par l'essai du sprint 2 : ignore voyelles, variantes de hamza,
// ة/ه, ى/ي, tatweel, caractères invisibles, ponctuation et espaces en trop.
function normalize(s) {
  return s.normalize('NFKC')
    .replace(/[ً-ٰٟۖ-ۭ]/g, '')
    .replace(/ـ/g, '')
    .replace(/[​-‏‪-‮⁦-⁩﻿]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[.,!?؟،؛:;«»"'()\-–—]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function isCorrect(input, phrase) {
  const val = normalize(input);
  return val !== '' && [phrase.ar, ...(phrase.accept || [])].some(a => normalize(a) === val);
}

function startExo3() {
  S.exo3Queue = shuffle(day().phrases.map((_, i) => i));
  S.exo3Index = 0;
  S.step = 'exo3';
  save(); render();
}

function renderExo3(el) {
  const d = day();
  if (!S.exo3Queue || !S.exo3Queue.length) { startExo3(); return; }
  if (S.exo3Index >= S.exo3Queue.length) {
    if (!S.completedDays.includes(d.id)) S.completedDays.push(d.id);
    S.step = 'done'; save(); render(); return;
  }
  const ph = d.phrases[S.exo3Queue[S.exo3Index]];
  const advance = () => { S.exo3Index++; save(); render(); };

  const counter = document.createElement('div');
  counter.className = 'ex-counter';
  counter.textContent = `Écrire — ${S.exo3Index + 1} / ${S.exo3Queue.length}`;
  el.appendChild(counter);

  const prompt = document.createElement('div');
  prompt.className = 'ex3-prompt';
  prompt.innerHTML = `<div class="ex3-prompt-label">Écris en arabe</div>${ph.fr}`;
  el.appendChild(prompt);

  const input = document.createElement('textarea');
  input.className = 'ex3-input ar';
  input.dir = 'rtl';
  input.lang = 'ar';
  input.rows = 2;
  input.placeholder = 'اكتب هنا…';
  input.autocomplete = 'off';
  input.setAttribute('autocorrect', 'off');
  input.autocapitalize = 'off';
  input.spellcheck = false;
  el.appendChild(input);

  const answer = document.createElement('div');
  answer.className = 'ex3-answer ar';
  answer.lang = 'ar';
  answer.textContent = ph.ar;
  answer.hidden = true;
  el.appendChild(answer);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn-check';
  checkBtn.textContent = 'Vérifier';
  el.appendChild(checkBtn);

  const skipBtn = document.createElement('button');
  skipBtn.className = 'btn-skip';
  skipBtn.textContent = 'Voir la réponse';
  el.appendChild(skipBtn);

  let checked = false;

    checked = true;
    input.classList.add(ok ? 'correct' : 'wrong');
    input.disabled = true;
    answer.hidden = false;
    checkBtn.textContent = 'Suivant →';
    skipBtn.hidden = true;
  };
  checkBtn.onclick = () => checked ? advance() : reveal(isCorrect(input.value, ph));
  skipBtn.onclick = () => reveal(false);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
  setTimeout(() => input.focus(), 100);
}

function renderDone(el) {

// ACTIONS
function goDay(id) {

// ── CORAN (sourates 78 à 114) ─────────────────────────────────────────────
// Les données sont importées depuis un fichier (ref/coran.json, construit par tools/build-coran.js) :
// elles restent dans le téléphone et ne sont jamais publiées avec l'app.
const CORAN_DATA_KEY = 'coran_data_v1';
const CORAN_STATE_KEY = 'coran_state_v1';
const SESSION_SIZE = 20;
const CORAN_QCM_COUNT = 10;
const VERSES_PER_SESSION = 5;
// Mots connus avant l'app (liste de SPRINTS.md, forme fusha) : ils comptent aussi comme connus ici.
const KNOWN_WORDS = ['أَنَا', 'صَحِيحٌ', 'عَلَى', 'يَوْمٌ', 'نَاسٌ', 'رَجُلٌ', 'بِنْتٌ', 'بَلَدٌ', 'لَيْلَةٌ', 'ظُهْرٌ',
  'نُقُودٌ', 'يَعْنِي', 'شُكْرًا', 'حَبِيبِي', 'نَعَمْ', 'لَا', 'هَيَّا', 'يَكْفِي'];

let CD = null;
try { CD = JSON.parse(localStorage.getItem(CORAN_DATA_KEY)); } catch (e) {}
let C = null;
try { C = JSON.parse(localStorage.getItem(CORAN_STATE_KEY)); } catch (e) {}
C = C || { learned: [], session: [], step: 'words', qcmQueue: [], qcmIndex: 0, verseQueue: [], verseIndex: 0, sessionsDone: 0 };
function saveCoran() { try { localStorage.setItem(CORAN_STATE_KEY, JSON.stringify(C)); } catch (e) {} }

function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Index calculés une fois par jeu de données.
let CX = null;
// Mots déjà connus côté fusha (liste de départ + jours), sous la forme bareWord. Partagé par Coran et Lecture.
let FUSHA_SET = null;
function fushaKnownSet() {
  if (FUSHA_SET) return FUSHA_SET;
  FUSHA_SET = new Set(KNOWN_WORDS.map(bareWord));
  DAYS.forEach(d => d.words.forEach(w => { const b = bareWord(w.ar); if (b.length > 1 && !b.includes(' ')) FUSHA_SET.add(b); }));
  return FUSHA_SET;
}

function coranIndex() {
  if (CX) return CX;
  const fusha = fushaKnownSet();
  const items = new Map(CD.items.map(i => [i.id, i]));
  const verses = new Map(CD.verses.map(v => [v.key, v]));
  const example = new Map();
  CD.verses.forEach(v => v.words.forEach(w => w.segs.forEach(s => {
    if (s.id && !example.has(s.id)) example.set(s.id, { word: w.t, key: v.key });
  })));
  const fromFusha = new Set(CD.items.filter(i => i.kind === 'mot' && !NOT_FROM_FUSHA.includes(i.id.normalize('NFC')) &&fusha.has(bareWord(i.ar))).map(i => i.id));
  return CX = { items, verses, example, fromFusha };
}
// Forme de comparaison avec un mot fusha : on garde les voyelles internes (sinon إِنَّ = الْآنَ, مَنْ = مِنْ)
// et on retire l'article, la terminaison, le tanwîn, le soukoun et la chadda d'assimilation de la 1re lettre.
function bareWord(s) {
  return s.normalize('NFKC')
    .replace(/[ٰۖ-ۭـًْ-ٍ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[؟?….!،]/g, '').trim()
    .replace(/^ال(?=..)/, '')
    .replace(/^(.)([َ-ِ]?)ّ/, '$1$2')
    .replace(/[َ-ّ]+$/, '');
}
// Homographes : même forme qu'un mot fusha connu, mais un autre mot (نَّعَم « bétail » ≠ نَعَمْ « oui »).
const NOT_FROM_FUSHA = ['L:نَّعَم'].map(id => id.normalize('NFC'));
function knownIds() { return new Set([...C.learned, ...coranIndex().fromFusha]); }
// Part des mots du texte dont on connaît tous les morceaux (préfixes, mot, pronom).
function coverage(ids) {
  let k = 0, t = 0;
  CD.verses.forEach(v => v.words.forEach(w => {
    t++;
    if (w.segs.every(s => !s.id || ids.has(s.id))) k++;
  }));
  return t ? Math.round(k / t * 100) : 0;
}

function startSession() {
  const known = knownIds();
  C.session = CD.items.filter(i => i.fr && !known.has(i.id)).slice(0, SESSION_SIZE).map(i => i.id);
  C.step = 'words'; C.qcmQueue = []; C.qcmIndex = 0; C.verseQueue = []; C.verseIndex = 0;
  saveCoran();
}

function renderCoran(root) {
  if (!CD) { renderCoranImport(root); return; }
  if (!C.session.length) startSession();
  const known = knownIds();

  const h = mk('div', 'header');
  const left = mk('div');
  left.append(mk('h1', '', 'Coran'), mk('p', '', `Sourates ${CD.surahs[0]} à ${CD.surahs[1]} · séance ${C.sessionsDone + (C.step === 'done' ? 0 : 1)}`));
  h.append(left, mk('div', 'streak', `${known.size} mots · ${coverage(known)} % du texte`));
  root.appendChild(h);

  if (!C.session.length) {
    root.appendChild(mk('p', 'q-empty', 'Toutes les séances disponibles sont faites. Les mots suivants arriveront avec la prochaine mise à jour du fichier coran.json.'));
  } else {
    root.appendChild(renderCoranTabs());
    const content = mk('div');
    if (C.step === 'words') renderCoranWords(content);
    else if (C.step === 'qcm') renderCoranQcm(content);
    else if (C.step === 'verses') renderCoranVerses(content);
    else renderCoranDone(content);
    root.appendChild(content);
  }
  root.appendChild(renderCoranFooter());
}

function renderCoranTabs() {
  const steps = [['words', 'Mots'], ['qcm', 'Sens'], ['verses', 'Versets']];
  const order = ['words', 'qcm', 'verses', 'done'];
  const tabs = mk('div', 'step-tabs');
  steps.forEach(([step, label]) => {
    const t = mk('button', 'step-tab', label);
    if (step === C.step) t.classList.add('active');
    else if (order.indexOf(step) < order.indexOf(C.step)) {
      t.classList.add('done-tab', 'reachable');
      t.onclick = () => { if (step === 'qcm') return startCoranQcm(); if (step === 'verses') return startCoranVerses(); C.step = step; saveCoran(); render(); };
    }
    tabs.appendChild(t);
  });
  return tabs;
}

const KIND_LABEL = { prefixe: 'préfixe', suffixe: 'pronom collé', mot: '' };
// Sens de ـنَا selon l'emploi, repéré par l'outil de construction (seg.royal).
const NOUS_MAJESTE = 'Nous, Notre : « Nous » de majesté, Allah parle de Lui-même (pas un « nous » ordinaire)';
const NOUS_COMMUN = 'nous, notre : « nous » ordinaire, ce sont des hommes qui parlent';

function renderCoranWords(root) {
  const { items, example } = coranIndex();
  root.appendChild(mk('div', 'section-label', `Mots de la séance (${C.session.length})`));
  const list = mk('div', 'word-list');
  C.session.forEach(id => {
    const it = items.get(id), ex = example.get(id);
    const row = mk('div', 'word-row');
    const main = mk('div', 'word-main');
    main.appendChild(mk('div', 'word-translation', it.fr));
    const meta = mk('div', 'q-meta');
    meta.append(`${KIND_LABEL[it.kind] ? KIND_LABEL[it.kind] + ' · ' : ''}${it.freq} fois · ex. `);
    const exw = mk('bdi', 'quran', ex ? ex.word : '');
    exw.lang = 'ar';
    meta.append(exw, ex ? ` (${ex.key})` : '');
    main.appendChild(meta);
    const ar = mk('div', 'word-arabic q-word-arabic quran', it.ar);
    ar.lang = 'ar';
    row.append(main, ar);
    list.appendChild(row);
  });
  root.appendChild(list);
  const btn = mk('button', 'btn-next-step', 'Continuer → Sens');
  btn.onclick = startCoranQcm;
  root.appendChild(btn);
}

function startCoranQcm() {
  C.qcmQueue = shuffle(C.session).slice(0, CORAN_QCM_COUNT);
  C.qcmIndex = 0; C.step = 'qcm';
  saveCoran(); render();
}

function renderCoranQcm(root) {
  if (!C.qcmQueue.length) { startCoranQcm(); return; }
  if (C.qcmIndex >= C.qcmQueue.length) { startCoranVerses(); return; }
  const { items } = coranIndex();
  const item = items.get(C.qcmQueue[C.qcmIndex]);
  const pool = [...new Set([...C.session, ...C.learned])].map(id => items.get(id)).filter(i => i && i.fr && i.fr !== item.fr);
  renderQuestion(root, {
    counter: `Sens — ${C.qcmIndex + 1} / ${C.qcmQueue.length}`,
    prompt: item.ar, promptClass: 'quran',
    options: shuffle([item, ...shuffle(pool).slice(0, QCM_CHOICES - 1)]), correct: item, answer: o => o.fr,
    choiceClass: '',
    advance: () => { C.qcmIndex++; saveCoran(); render(); },
  });
}

// Versets qui contiennent des mots de la séance, en privilégiant ceux dont on connaît le plus de mots.
function startCoranVerses() {
  const session = new Set(C.session), known = knownIds();
  const scored = CD.verses.map(v => {
    const ids = v.words.flatMap(w => w.segs.map(s => s.id).filter(Boolean));
    if (!ids.some(id => session.has(id))) return null;
    return { key: v.key, score: ids.filter(id => session.has(id) || known.has(id)).length / ids.length };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  C.verseQueue = shuffle(scored.slice(0, VERSES_PER_SESSION * 3)).slice(0, VERSES_PER_SESSION).map(s => s.key);
  C.verseIndex = 0; C.step = 'verses';
  saveCoran(); render();
}

function wordState(w, session, known) {
  const ids = w.segs.map(s => s.id).filter(Boolean);
  if (ids.some(id => session.has(id))) return 'new';
  return ids.every(id => known.has(id)) ? 'known' : 'unknown';
}

function renderCoranVerses(root) {
  if (!C.verseQueue.length) { startCoranVerses(); return; }
  if (C.verseIndex >= C.verseQueue.length) { finishSession(); return; }
  const { verses, items, fromFusha } = coranIndex();
  const v = verses.get(C.verseQueue[C.verseIndex]);
  const session = new Set(C.session), known = knownIds();

  root.appendChild(mk('div', 'ex-counter', `Versets — ${C.verseIndex + 1} / ${C.verseQueue.length} · ${v.key}`));
  root.appendChild(mk('p', 'q-hint', 'Touche un mot pour voir sa décomposition. En bleu : les mots de la séance ; en gris : ceux que tu ne connais pas encore.'));
  const box = mk('div', 'verse');
  box.lang = 'ar';
  const detail = mk('div', 'detail');
  detail.hidden = true;

  v.words.forEach(w => {
    const b = mk('button', 'vw ' + wordState(w, session, known), w.t);
    b.onclick = () => {
      box.querySelectorAll('.vw.selected').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      detail.innerHTML = '';
      w.segs.forEach(s => {
        const it = s.id && items.get(s.id);
        const row = mk('div', 'seg-row');
        const ar = mk('span', 'seg-ar', s.ar);
        ar.lang = 'ar';
        const fr = mk('span', 'seg-fr', s.royal === true ? NOUS_MAJESTE : s.royal === false ? NOUS_COMMUN : it ? (it.fr || '—') : '—');
        if (it) {
          const status = fromFusha.has(it.id) ? ['vu en fusha', 'fusha'] : session.has(it.id) ? ['séance', 'new']
            : C.learned.includes(it.id) ? ['appris', 'known'] : ['pas encore vu', ''];
          fr.appendChild(mk('span', 'badge ' + status[1], status[0]));
          if (KIND_LABEL[it.kind]) fr.appendChild(mk('span', 'seg-kind', ' ' + KIND_LABEL[it.kind]));
        }
        row.append(ar, fr);
        detail.appendChild(row);
      });
      detail.appendChild(mk('div', 'seg-en', `Dans ce verset (anglais) : ${w.en}`));
      detail.hidden = false;
    };
    box.appendChild(b);
  });
  root.append(box, detail);

  const next = mk('button', 'btn-next-step', C.verseIndex + 1 < C.verseQueue.length ? 'Verset suivant →' : 'Terminer la séance →');
  next.onclick = () => { C.verseIndex++; saveCoran(); render(); };
  root.appendChild(next);
}

function finishSession() {
  C.learned = [...new Set([...C.learned, ...C.session])];
  C.sessionsDone++;
  C.step = 'done';
  saveCoran(); render();
}

function renderCoranDone(root) {
  const known = knownIds();
  const box = mk('div', 'complete-box');
  box.append(mk('h2', '', 'Séance terminée !'),
    mk('p', '', `Tu connais maintenant ${known.size} mots et morceaux de mots : ${coverage(known)} % des mots des sourates ${CD.surahs[0]} à ${CD.surahs[1]} n'ont plus aucune partie inconnue.`));
  const btn = mk('button', 'btn-complete', 'Séance suivante →');
  btn.onclick = () => { startSession(); render(); };
  box.appendChild(btn);
  root.appendChild(box);
}

function fileInput(label, onError) {
  const wrap = mk('label', 'btn-check file-btn', label);
  const input = mk('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.hidden = true;
  input.onchange = () => input.files[0] && importCoran(input.files[0], onError);
  wrap.appendChild(input);
  return wrap;
}

function importCoran(file, onError) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.format !== 'coran-v1' || !Array.isArray(d.items) || !Array.isArray(d.verses)) {
        return onError("Ce fichier n'est pas un fichier coran.json produit par l'outil du projet.");
      }
      localStorage.setItem(CORAN_DATA_KEY, JSON.stringify(d));
      CD = d; CX = null;
      // Les mots appris restent appris ; la séance en cours est recalculée avec les nouvelles données.
      C.session = []; saveCoran();
      render();
    } catch (e) {
      onError(`Import impossible : ${e.message}`);
    }
  };
  reader.onerror = () => onError('Lecture du fichier impossible.');
  reader.readAsText(file);
}

function renderCoranImport(root) {
  const box = mk('div', 'import-box');
  box.append(mk('h1', '', 'Coran'),
    mk('p', '', "Pour commencer, importe le fichier coran.json. Il contient le texte des sourates 78 à 114, la décomposition et le sens des mots. Il reste dans ce téléphone : il n'est jamais publié avec l'app."),
    mk('p', 'q-hint', 'Envoie-toi le fichier (e-mail, Drive…), enregistre-le dans Téléchargements, puis choisis-le ici.'));
  const err = mk('p', 'q-error');
  err.hidden = true;
  box.append(fileInput('Choisir le fichier coran.json', msg => { err.textContent = msg; err.hidden = false; }), err);
  root.appendChild(box);
}

function renderCoranFooter() {
  const f = mk('div', 'q-footer');
  const fonts = mk('div', 'font-toggle');
  fonts.appendChild(mk('span', '', 'Police :'));
  [['amiri', 'Amiri Quran'], ['system', 'Police du téléphone']].forEach(([k, label]) => {
    const b = mk('button', PREFS.qfont === k ? 'active' : '', label);
    b.onclick = () => { PREFS.qfont = k; savePrefs(); render(); };
    fonts.appendChild(b);
  });
  f.appendChild(fonts);
  const err = mk('p', 'q-error');

  const src = mk('div', 'q-sources');

  src.appendChild(font);
  f.appendChild(src);
  return f;
}

// ── LECTURE ───────────────────────────────────────────────────────────────
// Une leçon = une règle de terminaison + un texte. Chaque mot porte « #n » : la règle qui fixe sa voyelle
// finale. Une fois la règle vue, cette voyelle disparaît ; les mots déjà vus en fusha perdent aussi
// leurs voyelles internes. Mot sans « #n » : terminaison fixe ou pas encore étudiée.
const RULES = {
  1: { title: 'Après une préposition : -i / -in',
       text: "Après فِي, مِنْ, إِلَى, عَلَى, عَنْ et les préfixes بِـ, لِـ, كَـ, le nom finit par ـِ (avec الْـ) ou ـٍ (sans الْـ). L'adjectif qui le suit prend la même terminaison.",
       ex: ['فِي الْبَيْتِ', 'فِي شَقَّةٍ صَغِيرَةٍ', 'بِالْحَافِلَةِ'] },
  2: { title: 'Le complément du nom : -i / -in',
       text: "Dans « X de Y », le 2e nom finit par ـِ ou ـٍ. Le 1er nom n'a jamais الْـ ni tanwîn. C'est pareil après مَعَ, عِنْدَ, قَبْلَ, بَعْدَ, قُرْبَ, qui sont en fait des noms.",
       ex: ['ثَلَّاجَةُ الْبَيْتِ', 'زُجَاجَةُ مَاءٍ', 'بَعْدَ الدَّرْسِ'] },
  3: { title: 'Le sujet et ce qu\'on en dit : -u / -un',
       text: "Le mot qui ouvre une phrase sans verbe, ce qu'on dit de lui, et le sujet d'un verbe finissent par ـُ ou ـٌ.",
       ex: ['اللُّغَةُ جَمِيلَةٌ', 'الثَّلَّاجَةُ فَارِغَةٌ'] },
  4: { title: 'Le complément : -a / -an', text: '', ex: [] },
  5: { title: 'Le verbe au présent : -u', text: '', ex: [] },
};
const LESSONS = [
  { n: 1, title: 'Ma journée', lines: [
    'أَسْكُنُ#5 فِي شَقَّةٍ#1 صَغِيرَةٍ#1 قُرْبَ#4 الْجَامِعَةِ#2.',
    'فِي الصَّبَاحِ#1 أَذْهَبُ#5 إِلَى الْجَامِعَةِ#1 بِالْحَافِلَةِ#1.',
    'أَدْرُسُ#5 اللُّغَةَ#4 الْعَرَبِيَّةَ#4 فِي قَاعَةٍ#1 كَبِيرَةٍ#1.',
    'بَعْدَ#4 الدَّرْسِ#2 أَجْلِسُ#5 فِي الْمَكْتَبَةِ#1 سَاعَةً#4 أَوْ سَاعَتَيْنِ.',
    'فِي الْمَسَاءِ#1 أَرْجِعُ#5 إِلَى الْبَيْتِ#1 وَأَطْبُخُ#5 لِأَصْدِقَائِي.',
    'ثُمَّ أَتَكَلَّمُ#5 مَعَ#4 أُمِّي عَلَى الْهَاتِفِ#1 قَبْلَ#4 النَّوْمِ#2.',
  ] },
  { n: 2, title: 'Le frigo des colocs', lines: [
    'ثَلَّاجَةُ#3 الْبَيْتِ#2 فَارِغَةٌ#3 الْيَوْمَ#4.',
    'لَا يُوجَدُ#5 فِيهَا إِلَّا عُلْبَةُ#3 حَلِيبٍ#2 وَقِطْعَةُ#3 جُبْنٍ#2.',
    'قَالَ صَدِيقِي: «أَنَا جَائِعٌ#3 جِدًّا#4!»',
    'فَذَهَبْنَا إِلَى سُوقِ#1 الْحَيِّ#2، وَاشْتَرَيْنَا خُبْزًا#4 وَبَيْضًا#4 وَزُجَاجَةَ#4 مَاءٍ#2.',
    'وَفِي طَرِيقِ#1 الْعَوْدَةِ#2 أَكَلْنَا قِطْعَةَ#4 كَعْكٍ#2 مِنْ مَخْبَزِ#1 الْحَيِّ#2.',
    'وَفِي الْمَسَاءِ#1 طَبَخْنَا عَشَاءً#4 لَذِيذًا#4 مَعًا.',
  ] },
  { n: 3, title: 'Mon niveau en arabe', lines: [
    'اللُّغَةُ#3 الْعَرَبِيَّةُ#3 جَمِيلَةٌ#3، لَكِنَّهَا صَعْبَةٌ#3 قَلِيلًا#4.',
    'مُسْتَوَايَ مُتَوَسِّطٌ#3: أَفْهَمُ#5 الْكَلَامَ#4 الْبَسِيطَ#4، لَكِنَّ الْقَوَاعِدَ#4 صَعْبَةٌ#3.',
    'أُسْتَاذُنَا صَبُورٌ#3 جِدًّا#4، وَزُمَلَائِي لَطِيفُونَ.',
    'كُلَّ#4 يَوْمٍ#2 أَقْرَأُ#5 صَفْحَةً#4 مِنْ كِتَابٍ#1 بَسِيطٍ#1.',
    'الْقِرَاءَةُ#3 مُفِيدَةٌ#3، وَالْمُحَادَثَةُ#3 أَهَمُّ#3.',
    'لِذَلِكَ أَتَكَلَّمُ#5 مَعَ#4 أَصْدِقَائِي بِالْفُصْحَى كُلَّ#4 مَسَاءٍ#2.',
  ] },
];

const LECTURE_KEY = 'lecture_state_v1';
let L = null;
try { L = JSON.parse(localStorage.getItem(LECTURE_KEY)); } catch (e) {}
L = L || { lesson: 1, done: [] };
function saveLecture() { try { localStorage.setItem(LECTURE_KEY, JSON.stringify(L)); } catch (e) {} }

const HARAKAT = /[ً-ْ]/g;
// Sépare un mot de ses signes finaux (ـًا : le tanwîn est sur la lettre avant l'alif).
function splitFinal(word) {
  const m = word.match(/^(.*?)([ً-ْ]*)(ا?)$/);
  if (m[3] && !m[2].includes('ً')) {
    const n = word.match(/^(.*?)([ً-ْ]*)$/);
    return [n[1], n[2], ''];
  }
  return [m[1], m[2], m[3]];
}
// Un jeton du texte : « «mot#n» » avec ponctuation éventuelle avant et après.
function parseToken(tok) {
  const m = tok.match(/^([«]*)(.+?)(?:#(\d))?([.،:!؟»]*)$/);
  return { pre: m[1], word: m[2], rule: m[3] ? +m[3] : 0, post: m[4] };
}
// Forme affichée selon la leçon : terminaison retirée si sa règle est vue, voyelles internes retirées si le mot est connu.
function displayWord(t, level) {
  const known = fushaKnownSet().has(bareWord(t.word));
  let [base, fin, alif] = splitFinal(t.word);
  // 1. Mot connu : voyelles internes et chadda retirées.
  if (known) { base = base.replace(HARAKAT, ''); fin = fin.replace(/ّ/g, ''); }
  // 2. Mot connu sans règle de terminaison : plus aucune voyelle.
  if (known && !t.rule) fin = '';
  // 3. Règle déjà vue : la terminaison disparaît, la chadda (qui appartient au mot) reste.
  if (t.rule && t.rule <= level) fin = fin.replace(/[^ّ]/g, '');
  return base + fin + alif;
}

function renderLecture(root) {
  const lesson = LESSONS.find(l => l.n === L.lesson) || LESSONS[0];
  const rule = RULES[lesson.n];

  const h = mk('div', 'header');
  const left = mk('div');
  left.append(mk('h1', '', 'Lecture'), mk('p', '', `Leçon ${lesson.n} — ${lesson.title}`));
  h.appendChild(left);
  root.appendChild(h);

  const nav = mk('div', 'day-nav');
  LESSONS.forEach(l => {
    const b = mk('button', 'day-btn', String(l.n));
    const open = l.n === 1 || L.done.includes(l.n - 1);
    if (L.done.includes(l.n)) b.classList.add('done');
    else if (l.n === lesson.n) b.classList.add('active');
    if (open) { b.classList.add('unlocked'); b.onclick = () => { L.lesson = l.n; saveLecture(); render(); }; }
    nav.appendChild(b);
  });
  root.appendChild(nav);

  const card = mk('div', 'rule-card');
  card.append(mk('div', 'rule-title', `Règle ${lesson.n} · ${rule.title}`));
  const p = mk('p', 'rule-text');
  p.innerHTML = arInline(rule.text);
  card.appendChild(p);
  const ex = mk('div', 'rule-ex ar', rule.ex.join('  ·  '));
  ex.lang = 'ar';
  card.appendChild(ex);
  card.appendChild(mk('p', 'q-hint', 'Dans le texte, les terminaisons des règles vues sont retirées, ainsi que les voyelles internes des mots déjà appris en fusha. Touche un mot pour vérifier.'));
  root.appendChild(card);

  const box = mk('div', 'reading ar');
  box.lang = 'ar';
  const detail = mk('div', 'detail');
  detail.hidden = true;
  lesson.lines.forEach(line => {
    const row = mk('p', 'reading-line');
    line.split(' ').forEach((tok, i) => {
      const t = parseToken(tok);
      if (i) row.append(' ');
      // Le mot et sa ponctuation restent sur la même ligne.
      const wrap = mk('span', 'rw-wrap');
      if (t.pre) wrap.append(t.pre);
      const b = mk('button', 'rw', displayWord(t, lesson.n));
      b.onclick = () => {
        box.querySelectorAll('.rw.selected').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        detail.innerHTML = '';
        const full = mk('div', 'rw-full ar', t.word);
        full.lang = 'ar';
        detail.appendChild(full);
        const why = t.rule
          ? `Terminaison : règle ${t.rule} · ${RULES[t.rule].title}${t.rule > lesson.n ? ' (leçon à venir)' : ''}`
          : 'Pas de règle de terminaison ici : forme fixe, ou pas encore étudiée.';
        detail.appendChild(mk('div', 'seg-fr', why));
        if (fushaKnownSet().has(bareWord(t.word))) detail.appendChild(mk('div', 'seg-kind', 'Mot déjà vu en fusha : voyelles internes retirées.'));
        detail.hidden = false;
      };
      wrap.appendChild(b);
      if (t.post) wrap.append(t.post);
      row.appendChild(wrap);
    });
    box.appendChild(row);
  });
  root.append(box, detail);

  const next = LESSONS.find(l => l.n === lesson.n + 1);
  const btn = mk('button', 'btn-next-step', next ? `J'ai lu le texte → leçon ${next.n}` : "J'ai lu le texte");
  btn.onclick = () => {
    if (!L.done.includes(lesson.n)) L.done.push(lesson.n);
    if (next) L.lesson = next.n;
    saveLecture(); render();
  };
  root.appendChild(btn);
  if (!next && L.done.includes(lesson.n)) root.appendChild(mk('p', 'q-empty', 'Les prochaines leçons arrivent bientôt : le complément (-a / -an), puis le verbe au présent (-u).'));
}

render();

// ── HORS LIGNE ─────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW non enregistré', err));
}
</script>
